<!DOCTYPE html>
<html>
<head>
    <title>USGS River Discharge Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 10px; 
            margin: 0;
        }
        
        /* The CSS Grid magic happens here */
        #charts-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two equal columns */
            gap: 20px; /* 30px space between the graphs */
        }

        .chart-container { 
            position: relative; 
            height: 300px; 
            width: 100%; 
        }

        /* Responsive rule: On small screens (like phones), drop back to 1 column */
        @media (max-width: 800px) {
            #charts-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="charts-wrapper"></div>

    <script>
       // 1. DYNAMICALLY LOAD SITES FROM THE URL
        const urlParams = new URLSearchParams(window.location.search);
        const sitesParam = urlParams.get('sites');
        
        let siteNumbers = [];
        
      if (sitesParam) {
          siteNumbers = sitesParam.split(',');
      } else {
          document.getElementById('charts-wrapper').innerHTML = '<p>No sites provided</p>';
      }

       async function fetchAllSites() {
          const wrapper = document.getElementById('charts-wrapper');

          if (!sitesParam || siteNumbers.length === 0) {
            wrapper.innerHTML = '<p>No sites provided</p>';
            siteNumbers = ['01422747'] //default site for testing
          }

            for (const siteNo of siteNumbers) {
                try {
                    let isDischarge = true;

                    // Helper function to check if the payload actually contains data points
                    const hasDataPoints = (apiData) => {
                        return apiData.value &&
                               apiData.value.timeSeries &&
                               apiData.value.timeSeries.length > 0 &&
                               apiData.value.timeSeries[0].values &&
                               apiData.value.timeSeries[0].values.length > 0 &&
                               apiData.value.timeSeries[0].values[0].value &&
                               apiData.value.timeSeries[0].values[0].value.length > 0;
                    };

                    // 1. Fetch data using the reliable NWIS JSON API for Discharge (00060)
                    let ivUrl = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteNo}&period=P5D&parameterCd=00060`;
                    let response = await fetch(ivUrl);
                    let data = await response.json();

                    // 2. Guard against missing discharge data points and fallback to Stage (00065)
                    if (!hasDataPoints(data)) {
                        isDischarge = false;
                        ivUrl = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteNo}&period=P5D&parameterCd=00065`;
                        response = await fetch(ivUrl);
                        data = await response.json();

                        // If stage is also missing data points, throw error
                        if (!hasDataPoints(data)) {
                            throw new Error("Neither discharge nor stage data available for this site.");
                        }
                    }

                    const timeSeriesData = data.value.timeSeries[0];
                    const dynamicSiteName = timeSeriesData.sourceInfo.siteName;
                    const timeSeries = timeSeriesData.values[0].value;

                    // 3. Parse the time series
                    const continuousData = [];
                    for (let i = 0; i < timeSeries.length; i++) {
                        const currentItem = timeSeries[i];
                        const currentTime = new Date(currentItem.dateTime);
                        const currentValue = parseFloat(currentItem.value);

                        if (i > 0) {
                            const previousTime = new Date(timeSeries[i - 1].dateTime);
                            const timeDiffMinutes = (currentTime - previousTime) / (1000 * 60);

                            if (timeDiffMinutes > 60) {
                                continuousData.push({ x: new Date(previousTime.getTime() + (1000 * 60)), y: null });
                            }
                        }
                        continuousData.push({ x: currentTime, y: currentValue });
                    }

                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    const canvas = document.createElement('canvas');
                    chartDiv.appendChild(canvas);
                    wrapper.appendChild(chartDiv);

                    renderChart(canvas, continuousData, dynamicSiteName, siteNo, isDischarge);

                } catch (error) {
                    console.error("Error fetching USGS data for site " + siteNo + ":", error);
                    const errorMsg = document.createElement('p');
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = "Error loading river data for site " + siteNo + " - Details: " + error.message;
                    wrapper.appendChild(errorMsg);
                }
            }
        }

        function renderChart(canvasElement, continuousData, dynamicSiteName, siteNo, isDischarge) {
            const ctx = canvasElement.getContext('2d');

            // Set dynamic properties based on the parameter fetched
            const dataLabel = isDischarge ? 'Discharge' : 'Gage Height';
            const unit = isDischarge ? 'cfs' : 'ft';
            const yAxisType = isDischarge ? 'logarithmic' : 'linear';
            const yAxisTitle = isDischarge ? 'Discharge (ft³/s) [Log Scale]' : 'Gage Height (ft) [Linear Scale]';
            const lineColor = isDischarge ? 'rgba(0, 51, 153, 1)' : 'rgba(0, 153, 102, 1)'; // Blue for discharge, Green for stage

            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: dataLabel,
                        data: continuousData,
                        borderColor: lineColor,
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.1,
                        fill: false,
                        spanGaps: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Makes the tooltip appear when hovering anywhere in the vertical column, not just exactly on the line
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy h:mm a' // This handles the Time format in the tooltip title
                            },
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            type: yAxisType,
                            title: { display: true, text: yAxisTitle }
                        }
                    },
                    plugins: {
                        legend: { display: false, position: 'top' },
                        title: {
                            display: true,
                            text: [
                                dynamicSiteName,
                                'USGS No: ' + siteNo + ` (${dataLabel})`
                            ]
                        },
                        // Custom Tooltip Configuration
                        tooltip: {
                            displayColors: false, // Hides the little color box in the tooltip
                            callbacks: {
                                label: function(context) {
                                    // Formats the hover text dynamically based on the active metric
                                    return `${dataLabel}: ${context.parsed.y} ${unit}`;
                                }
                            }
                        }
                    }
                }
            });
        }
        fetchAllSites();
    </script>
</body>
</html>

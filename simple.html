<!DOCTYPE html>
<html>
<head>
    <title>USGS River Discharge Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 10px; 
            margin: 0;
        }
        
        /* The CSS Grid magic happens here */
        #charts-wrapper {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Two equal columns */
            gap: 20px; /* 30px space between the graphs */
        }

        .chart-container { 
            position: relative; 
            height: 300px; 
            width: 100%; 
        }

        /* Responsive rule: On small screens (like phones), drop back to 1 column */
        @media (max-width: 800px) {
            #charts-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="charts-wrapper"></div>

    <script>
       // 1. DYNAMICALLY LOAD SITES FROM THE URL
        const urlParams = new URLSearchParams(window.location.search);
        const sitesParam = urlParams.get('sites');
        
        let siteNumbers = [];
        
      if (sitesParam) {
          siteNumbers = sitesParam.split(',');
      } else {
          document.getElementById('charts-wrapper').innerHTML = '<p>No sites provided</p>';
      }

       async function fetchAllSites() {
          const wrapper = document.getElementById('charts-wrapper');

          if (!sitesParam || siteNumbers.length === 0) {
            wrapper.innerHTML = '<p>No sites provided</p>';
            siteNumbers = ['01422747'] //default site for testing
           // return;
          }

            for (const siteNo of siteNumbers) {


                /*
                //This is using the new api but it currently does not work for all usgs gage sites for some reason - will have to revisit in
                try {

                    const end = new Date();
                    end.setDate(end.getDate() - 5);
                    // Format as an OGC API datetime range (start/..)
                   const datetimeParam = `${end.toISOString()}/..`;

                    const ivUrl = 'https://api.waterdata.usgs.gov/ogcapi/v1/collections/continuous/items?limit=700&f=json&lang=en-US&skipGeometry=false&offset=0&datetime=' + datetimeParam + '&monitoring_location_id=USGS-' + siteNo + '&parameter_code=00060';
                    const response = await fetch(ivUrl);
                    const data = await response.json();

                    const timeSeries = data.features;

                    //Fetch the site metadata to get the official monitoring location name
                    const metaUrl = `https://api.waterdata.usgs.gov/ogcapi/v1/collections/monitoring-locations/items?monitoring_location_number=${siteNo}&f=json`;
                    const metaResponse = await fetch(metaUrl);
                    const metaData = await metaResponse.json();

                    let dynamicSiteName = 'Monitoring Location: ' + siteNo;
                    if (metaData.features && metaData.features.length > 0) {
                        dynamicSiteName = metaData.features[0].properties.monitoring_location_name;
                    }

                    // Optional: The new API might return data in descending order (newest first).
                    // Chart.js prefers chronological order, so you may need to reverse it:
                   // timeSeries.reverse();
                    const continuousData = [];

                    for (let i = 0; i < timeSeries.length; i++) {
                        const currentItem = timeSeries[i];
                        const currentTime = new Date(currentItem.properties.time);
                        const currentValue = parseFloat(currentItem.properties.value);

                        if (i > 0) {
                            const previousTime = new Date(timeSeries[i - 1].properties.time);
                            // Calculate difference in minutes
                            const timeDiffMinutes = (currentTime - previousTime) / (1000 * 60);

                            // If the gap is greater than 60 minutes, data is missing
                            if (timeDiffMinutes > 60) {
                                // Insert a null point right after the last good reading to break the line
                                continuousData.push({
                                    x: new Date(previousTime.getTime() + (1000 * 60)),
                                    y: null
                                });
                            }
                        }

                        continuousData.push({
                            x: currentTime,
                            y: currentValue
                        });
                    } */
                try {
                    // 1. Fetch data using the reliable NWIS JSON API instead of OGC API
                    const ivUrl = `https://waterservices.usgs.gov/nwis/iv/?format=json&sites=${siteNo}&period=P5D&parameterCd=00060`;
                    const response = await fetch(ivUrl);
                    const data = await response.json();

                    // 2. Guard against missing data to prevent crashes
                    if (!data.value || !data.value.timeSeries || data.value.timeSeries.length === 0) {
                        throw new Error("Data not available for this site.");
                    }

                    const timeSeriesData = data.value.timeSeries[0];
                    const dynamicSiteName = timeSeriesData.sourceInfo.siteName;
                    const timeSeries = timeSeriesData.values[0].value;

                    // 3. Parse the time series
                    const continuousData = [];
                    for (let i = 0; i < timeSeries.length; i++) {
                        const currentItem = timeSeries[i];
                        // Note: NWIS uses .dateTime and .value instead of .properties
                        const currentTime = new Date(currentItem.dateTime);
                        const currentValue = parseFloat(currentItem.value);

                        if (i > 0) {
                            const previousTime = new Date(timeSeries[i - 1].dateTime);
                            const timeDiffMinutes = (currentTime - previousTime) / (1000 * 60);

                            if (timeDiffMinutes > 60) {
                                continuousData.push({ x: new Date(previousTime.getTime() + (1000 * 60)), y: null });
                            }
                        }
                        continuousData.push({ x: currentTime, y: currentValue });
                    }

                    const chartDiv = document.createElement('div');
                    chartDiv.className = 'chart-container';
                    const canvas = document.createElement('canvas');
                    chartDiv.appendChild(canvas);
                    wrapper.appendChild(chartDiv);

                    renderChart(canvas, continuousData, dynamicSiteName, siteNo);

                } catch (error) {
                    console.error("Error fetching USGS data for site " + siteNo + ":", error);
                    const errorMsg = document.createElement('p');
                    errorMsg.style.color = 'red';
                    errorMsg.textContent = "Error loading river data for site " + siteNo + " - Details: " + error.message;
                    wrapper.appendChild(errorMsg);
                }
            }
        }

        function renderChart(canvasElement, continuousData, dynamicSiteName, siteNo) {
            const ctx = canvasElement.getContext('2d');
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [{
                        label: 'Discharge',
                        data: continuousData,
                        borderColor: 'rgba(0, 51, 153, 1)', 
                        borderWidth: 2,
                        pointRadius: 0, 
                        tension: 0.1,
                        fill: false,
                        spanGaps: false

                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    // Makes the tooltip appear when hovering anywhere in the vertical column, not just exactly on the line
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day',
                                displayFormats: { day: 'MMM d' },
                                tooltipFormat: 'MMM d, yyyy h:mm a' // This handles the Time format in the tooltip title
                            },
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            type: 'logarithmic',
                            title: { display: true, text: 'Discharge (ft³/s) [Log Scale]' }
                        }
                    },
                    plugins: {
                        legend: { display: false, position: 'top' },
                        title: { 
                            display: true, 
                            text: [
                                dynamicSiteName,
                                'USGS No: ' + siteNo
                            ]
                        },
                        // Custom Tooltip Configuration
                        tooltip: {
                            displayColors: false, // Hides the little color box in the tooltip
                            callbacks: {
                                label: function(context) {
                                    // Formats the hover text to show "X cfs"
                                    return `Discharge: ${context.parsed.y} cfs`;
                                }
                            }
                        }
                    }
                }
            });
        }
        fetchAllSites();
    </script>
</body>
</html>
